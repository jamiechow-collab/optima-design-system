<style>
  /* Docs pages follow the Figma guideline layout: Inter type, no rules under
     section headings, 80px between sections, Display/bold-3 section titles. */

  .sbdocs-wrapper,
  .sbdocs-wrapper h1,
  .sbdocs-wrapper h2,
  .sbdocs-wrapper h3,
  .sbdocs-wrapper h4,

    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .sbdocs-wrapper code,
  .sbdocs-wrapper pre {
    font-family: ui-monospace, Menlo, Monaco, 'Cascadia Mono', monospace;
  }

  /* Page title — Display/bold-3 (32/40 bold, text/primary) */

  .sbdocs-content > h1 {

    line-height: 40px;
    font-weight: 700;

  .sbdocs-content h2:not(.sbdocs-subtitle) {
    border-bottom: none;
    padding-bottom: 0;

    font-size: 32px;
    line-height: 40px;
    font-weight: 700;
    color: #050505;
